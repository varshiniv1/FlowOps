version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/FlowOps.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=flowops;Username=postgres;Password=postgres
      - Jwt__Key=CHANGE-ME-use-a-real-secret-key-at-least-32-chars
      - Jwt__Issuer=FlowOps
      - Jwt__Audience=FlowOps
      - Jwt__ExpiryMinutes=60
      - AWS__Region=us-east-1
      - AWS__BucketName=flowops-product-images
    depends_on:
      - db

volumes:
  pgdata:
